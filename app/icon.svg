<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="oilGrad" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Oil Droplet & Retail Core -->
  <g filter="url(#glow)">
    <path 
      d="M16 5.5C16 5.5 8.5 15.2 8.5 19.8C8.5 24 11.8 27.5 16 27.5C20.2 27.5 23.5 24 23.5 19.8C23.5 15.2 16 5.5 16 5.5Z" 
      fill="url(#oilGrad)" 
    />
    <!-- Inner Core Highlight -->
    <path 
      d="M13.5 18C13.5 15.5 15.2 11.5 16 9.8C16.8 11.5 18.5 15.5 18.5 18C18.5 19.4 17.4 20.5 16 20.5C14.6 20.5 13.5 19.4 13.5 18Z" 
      fill="#FDE68A" 
      opacity="0.8" 
    />
    <!-- Sparkle dot -->
    <circle cx="14" cy="15" r="1.2" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
