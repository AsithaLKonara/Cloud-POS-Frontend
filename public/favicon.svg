<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="xonitBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#05070B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Stroke 1 Gradient: Electric Cyan to Indigo -->
    <linearGradient id="xStroke1" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Stroke 2 Gradient: Vivid Violet to Cyan Core -->
    <linearGradient id="xStroke2" x1="26" y1="6" x2="6" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- High-Tech Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#06B6D4" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#6366F1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Obsidian Rounded Container with subtle border -->
  <rect width="32" height="32" rx="8" fill="url(#xonitBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- The Iconic Geometric X Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Primary Forward Diagonal Blade -->
    <path
      d="M7.5 7.5L12.5 7.5L24.5 24.5L19.5 24.5Z"
      fill="url(#xStroke1)"
    />

    <!-- Overlapping Interlocking Reverse Diagonal Wings with Negative Space Cut -->
    <path
      d="M24.5 7.5L19.5 7.5L15.3 13.5L17.8 17L24.5 7.5Z"
      fill="url(#xStroke2)"
    />
    <path
      d="M14.2 18.5L11.7 15L7.5 24.5L12.5 24.5L14.2 18.5Z"
      fill="url(#xStroke2)"
    />

    <!-- Center Pulse Core Intersection -->
    <circle cx="16" cy="16" r="1.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="16" cy="16" r="2.8" fill="#38BDF8" opacity="0.3" />
  </g>
</svg>
